{% if site.data.news %}
  {% assign news_items = site.data.news | sort: "date" | reverse %}
  <ul class="news-list">
    {% for item in news_items %}
      <li class="news-item">
        <time class="news-date" datetime="{{ item.date | date: '%Y-%m-%d' }}">{{ item.date | date: "%b %Y" }}</time>
        <div class="news-content">{{ item.content | markdownify }}</div>
      </li>
    {% endfor %}
  </ul>
{% endif %}
